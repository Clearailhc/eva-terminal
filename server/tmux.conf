# @@unit@@ tmux — status bar with live GPU summary (refreshed every 5s)
# template: install.sh fills @@…@@ with the chosen unit's colours (eva02 template)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 50000
set -g status-interval 5

set -g status-style "bg=@@deep@@,fg=#f0ece8"
set -g status-left-length 40
set -g status-left "#[bg=@@frame@@,fg=#f0ece8,bold] @@unit@@ #[bg=@@dark@@,fg=@@side@@] #S #[default] "
set -g status-right-length 120
set -g status-right "#(~/.local/bin/eva02 seg tmux)#[default] #[fg=#827d87]│ #[fg=#827d87]%H:%M "
setw -g window-status-format "#[fg=#827d87] #I:#W "
setw -g window-status-current-format "#[bg=@@alt@@,fg=@@deep@@,bold] #I:#W "
set -g pane-border-style "fg=#46424c"
set -g pane-active-border-style "fg=@@frame@@"
set -g message-style "bg=@@frame@@,fg=#f0ece8"
