# EVA-02 tmux — status bar with live GPU summary (refreshed every 5s)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 50000
set -g status-interval 5

set -g status-style "bg=#1a0a0e,fg=#f0ece8"
set -g status-left-length 40
set -g status-left "#[bg=#e62028,fg=#f0ece8,bold] EVA-02 #[bg=#3c0a0f,fg=#ffbe28] #S #[default] "
set -g status-right-length 120
set -g status-right "#(~/.local/bin/eva02 seg tmux)#[default] #[fg=#827d87]│ #[fg=#827d87]%H:%M "
setw -g window-status-format "#[fg=#827d87] #I:#W "
setw -g window-status-current-format "#[bg=#ff8000,fg=#1a0a0e,bold] #I:#W "
set -g pane-border-style "fg=#46424c"
set -g pane-active-border-style "fg=#e62028"
set -g message-style "bg=#e62028,fg=#f0ece8"
